name: Apply POS Save And Apply Controls

on:
  push:
    branches:
      - fix/pos-save-apply-1.7.25
    paths:
      - .github/workflows/patch-pos-save-apply.yml
      - scripts/Patch-PosSaveApply.py

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pos-save-apply-1.7.25
          fetch-depth: 0

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply source patch
        shell: pwsh
        run: python scripts/Patch-PosSaveApply.py

      - name: Restore POS packages
        shell: pwsh
        run: dotnet restore pos-controller/src/MulletHopPosController.csproj -r win-x64

      - name: Build Mullet Hop POS
        shell: pwsh
        run: dotnet build pos-controller/src/MulletHopPosController.csproj -c Release -r win-x64 --self-contained true --no-restore

      - name: Commit completed patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pos-save-apply.yml
          git rm scripts/Patch-PosSaveApply.py
          git add pos-controller/src/PosSettingsDialog.cs
          git add pos-controller/src/PosControllerForm.cs
          git add pos-controller/src/MulletHopPosController.csproj
          git commit -m "Add POS Save and Apply controls"
          git push origin HEAD:fix/pos-save-apply-1.7.25
