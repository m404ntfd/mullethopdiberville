name: Fix Stored GRF Builder

on:
  push:
    branches:
      - fix/wristband-stored-grf-1.7.22
    paths:
      - scripts/Fix-StoredGrfBuilder.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/wristband-stored-grf-1.7.22
          fetch-depth: 0

      - name: Fix source
        run: python scripts/Fix-StoredGrfBuilder.py

      - name: Commit builder fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/Fix-StoredGrfBuilder.py
          git rm .github/workflows/fix-wristband-stored-grf-builder.yml
          git add pos-controller/src/DirectWristbandPrinter.cs
          git commit -m "Fix stored GRF command construction"
          git push origin HEAD:fix/wristband-stored-grf-1.7.22
