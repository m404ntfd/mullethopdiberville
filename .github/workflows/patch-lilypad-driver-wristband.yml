name: Apply LilyPad Driver Wristband Patch

on:
  push:
    branches:
      - fix/lilypad-driver-wristband-1.7.23
    paths:
      - scripts/Patch-LilyPadDriverWristband.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/lilypad-driver-wristband-1.7.23
          fetch-depth: 0
      - name: Patch source
        run: python scripts/Patch-LilyPadDriverWristband.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/Patch-LilyPadDriverWristband.py
          git rm .github/workflows/patch-lilypad-driver-wristband.yml
          git add pos-controller/src/DirectWristbandPrinter.cs pos-controller/src/MulletHopPosController.csproj
          git commit -m "Use LilyPad-compatible Zebra driver wristband path"
          git push origin HEAD:fix/lilypad-driver-wristband-1.7.23
