name: Apply LilyPad Driver Wristband Patch

on:
  push:
    branches:
      - fix/lilypad-driver-wristband-1.7.23
    paths:
      - .github/workflows/patch-lilypad-driver-wristband.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lilypad-driver-wristband-1.7.23
          fetch-depth: 0
      - name: Apply LilyPad-compatible Windows driver print path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pos-controller/src/DirectWristbandPrinter.cs')
          text = path.read_text(encoding='utf-8')

          old = '''            if (IsNativeZplDriver(driverName))
            {
                PosLog.Write(
                    $"Wristband printer {printerName} uses driver '{driverName}'; " +
                    "bypassing the Windows GDI graphics path and using a downloaded GRF graphic with explicit Zebra orientation resets.");
                PrintRenderedPagesAsZpl(
                    pages,
                    printerName,
                    driverName,
                    cancellationToken);
            }
            else
            {
                PrintRenderedPages(pages, printerName, cancellationToken);
            }
'''
          new = '''            if (IsNativeZplDriver(driverName))
            {
                PosLog.Write(
                    $"Wristband printer {printerName} uses driver '{driverName}'; " +
                    "using LilyPad-compatible Windows driver settings instead of RAW ZPL so the Zebra driver's configured Landscape, 180-degree rotation, 1x10 media, and mark sensing remain authoritative.");
            }
            PrintRenderedPagesWithConfiguredDriver(pages, printerName, cancellationToken);
'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '    private static void PrintRenderedPages(\n'
          assert marker in text
          method = r'''    private static void PrintRenderedPagesWithConfiguredDriver(
        IReadOnlyList<Bitmap> pages,
        string printerName,
        CancellationToken cancellationToken)
    {
        var pageIndex = 0;
        using var document = new PrintDocument
        {
            DocumentName = "Mullet Hop Wristbands",
            PrintController = new StandardPrintController(),
            OriginAtMargins = false,
            PrinterSettings = new PrinterSettings
            {
                PrinterName = printerName,
                Copies = 1
            }
        };

        // Do not replace the Zebra driver's PageSettings. LilyPad's own setup guide
        // requires the printer to remain configured as Landscape, page format rotated
        // 180 degrees, 1 x 10 inch media, Mark Sensing, and Always Use Driver Settings.
        // Preserving DefaultPageSettings lets the driver apply those private Zebra
        // settings while keeping the print job silent/background-only.
        document.PrintPage += (_, eventArgs) =>
        {
            cancellationToken.ThrowIfCancellationRequested();
            var source = pages[pageIndex];
            var graphics = eventArgs.Graphics ?? throw new InvalidOperationException(
                "Windows did not provide a graphics surface for the wristband printer.");
            var bounds = graphics.VisibleClipBounds;
            if (!float.IsFinite(bounds.Width) || !float.IsFinite(bounds.Height) ||
                bounds.Width <= 1 || bounds.Height <= 1)
            {
                bounds = eventArgs.PageBounds;
            }

            var scale = Math.Min(bounds.Width / source.Width, bounds.Height / source.Height);
            var targetWidth = source.Width * scale;
            var targetHeight = source.Height * scale;
            var targetX = bounds.Left + (bounds.Width - targetWidth) / 2f;
            var targetY = bounds.Top + (bounds.Height - targetHeight) / 2f;

            graphics.CompositingMode = CompositingMode.SourceCopy;
            graphics.CompositingQuality = CompositingQuality.HighQuality;
            graphics.InterpolationMode = InterpolationMode.HighQualityBicubic;
            graphics.PixelOffsetMode = PixelOffsetMode.HighQuality;
            graphics.SmoothingMode = SmoothingMode.HighQuality;
            graphics.DrawImage(
                source,
                new RectangleF(targetX, targetY, targetWidth, targetHeight),
                new RectangleF(0, 0, source.Width, source.Height),
                GraphicsUnit.Pixel);

            PosLog.Write(
                $"Submitted wristband page {pageIndex + 1} to {printerName} through the configured Zebra Windows driver: " +
                $"paper={eventArgs.PageBounds.Width}x{eventArgs.PageBounds.Height}, " +
                $"landscape={eventArgs.PageSettings.Landscape}, " +
                $"printable={bounds.X:0.##},{bounds.Y:0.##},{bounds.Width:0.##}x{bounds.Height:0.##}, " +
                $"source={source.Width}x{source.Height}, target={targetX:0.##},{targetY:0.##},{targetWidth:0.##}x{targetHeight:0.##}. " +
                "No RAW ZPL, GRF download, forced media length, forced printhead width, or reconstructed media offset was used.");

            pageIndex++;
            eventArgs.HasMorePages = pageIndex < pages.Count;
        };

        cancellationToken.ThrowIfCancellationRequested();
        document.Print();
    }

'''
          text = text.replace(marker, method + marker, 1)

          project = Path('pos-controller/src/MulletHopPosController.csproj')
          project_text = project.read_text(encoding='utf-8')
          assert '<Version>1.7.22</Version>' in project_text
          project_text = project_text.replace('<Version>1.7.22</Version>', '<Version>1.7.23</Version>', 1)
          project.write_text(project_text, encoding='utf-8')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-lilypad-driver-wristband.yml
          git add pos-controller/src/DirectWristbandPrinter.cs pos-controller/src/MulletHopPosController.csproj
          git commit -m "Use LilyPad-compatible Zebra driver wristband path"
          git push origin HEAD:fix/lilypad-driver-wristband-1.7.23
