name: Publish Kiosk Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiosk-release
  cancel-in-progress: false

jobs:
  publish-windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $projectText = Get-Content -LiteralPath "src/MulletHopWaiverKiosk.csproj" -Raw
          if ($projectText -notmatch '<Version>([^<]+)</Version>') {
            throw 'The project file does not contain a Version value.'
          }
          "value=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read controller version
        id: controller_version
        shell: pwsh
        run: |
          $projectText = Get-Content -LiteralPath "controller/src/MulletHopKioskController.csproj" -Raw
          if ($projectText -notmatch '<Version>([^<]+)</Version>') {
            throw 'The controller project file does not contain a Version value.'
          }
          "value=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read POS controller version
        id: pos_version
        shell: pwsh
        run: |
          $projectText = Get-Content -LiteralPath "pos-controller/src/MulletHopPosController.csproj" -Raw
          if ($projectText -notmatch '<Version>([^<]+)</Version>') {
            throw 'The POS controller project file does not contain a Version value.'
          }
          "value=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Assemble screensaver video
        shell: pwsh
        run: ./scripts/Assemble-Screensaver.ps1

      - name: Restore packages
        shell: pwsh
        run: |
          dotnet restore src/MulletHopWaiverKiosk.csproj
          dotnet restore controller/src/MulletHopKioskController.csproj
          dotnet restore pos-controller/src/MulletHopPosController.csproj

      - name: Publish kiosk application
        shell: pwsh
        run: |
          dotnet publish src/MulletHopWaiverKiosk.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:UpdateRepositoryUrl=https://github.com/${{ github.repository }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            --output publish

      - name: Verify packaged kiosk media
        shell: pwsh
        run: |
          $screensaverPath = "publish/MulletHopScreensaver.mp4"
          if (-not (Test-Path -LiteralPath $screensaverPath -PathType Leaf)) {
            throw "The published kiosk is missing $screensaverPath."
          }

          $screensaver = Get-Item -LiteralPath $screensaverPath
          if ($screensaver.Length -lt 1MB) {
            throw "The published screensaver video is unexpectedly small."
          }

          Write-Host "Screensaver video included: $($screensaver.Length) bytes."

          $backgroundPath = "publish/MulletHopKioskBackground.jpg"
          if (-not (Test-Path -LiteralPath $backgroundPath -PathType Leaf)) {
            throw "The published kiosk is missing $backgroundPath."
          }

          $background = Get-Item -LiteralPath $backgroundPath
          if ($background.Length -lt 100KB) {
            throw "The published kiosk background is unexpectedly small."
          }

          Write-Host "Kiosk background included: $($background.Length) bytes."

      - name: Publish kiosk controller
        shell: pwsh
        run: |
          dotnet publish controller/src/MulletHopKioskController.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.controller_version.outputs.value }} `
            -p:UpdateRepositoryUrl=https://github.com/${{ github.repository }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            --output controller-publish

      - name: Publish POS controller
        shell: pwsh
        run: |
          dotnet publish pos-controller/src/MulletHopPosController.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.pos_version.outputs.value }} `
            -p:UpdateRepositoryUrl=https://github.com/${{ github.repository }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            --output pos-publish

      - name: Verify POS controller startup
        shell: pwsh
        run: |
          & "pos-publish/MulletHopPosController.exe" --startup-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "The POS Controller startup smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Install matching Velopack command-line tool
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download prior kiosk release information
        shell: pwsh
        run: |
          $latestRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
            -SkipHttpErrorCheck

          if ($latestRelease.status -eq 404 -or -not $latestRelease.tag_name) {
            Write-Host "No earlier release exists. Building the first full installer."
          }
          else {
            vpk download github `
              --repoUrl https://github.com/${{ github.repository }} `
              --token "${{ secrets.GITHUB_TOKEN }}" `
              --channel win `
              --outputDir Releases
          }

      - name: Download prior controller release information
        id: controller_feed
        shell: pwsh
        run: |
          $needsPack = $true
          try {
            vpk download github `
              --repoUrl https://github.com/${{ github.repository }} `
              --token "${{ secrets.GITHUB_TOKEN }}" `
              --channel controller `
              --outputDir ControllerReleases
          }
          catch {
            Write-Host "No earlier controller update feed exists. Building the first full controller installer."
            New-Item -ItemType Directory -Path ControllerReleases -Force | Out-Null
          }

          $currentVersion = "${{ steps.controller_version.outputs.value }}"
          $expectedPackage = "MulletHop.KioskController-$currentVersion-controller-full.nupkg"
          $latestRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
            -SkipHttpErrorCheck
          $matchingAsset = @(
            $latestRelease.assets | Where-Object { $_.name -eq $expectedPackage }
          )

          if ($matchingAsset.Count -gt 0) {
            $needsPack = $false
            Write-Host "Controller $currentVersion is already packaged; reusing its release files."

            $controllerAssets = @(
              $latestRelease.assets | Where-Object {
                $_.name -eq "assets.controller.json" -or
                $_.name -eq "releases.controller.json" -or
                $_.name -like "MulletHop.KioskController-*"
              }
            )
            New-Item -ItemType Directory -Path ControllerReleases -Force | Out-Null

            foreach ($asset in $controllerAssets) {
              $destination = Join-Path "ControllerReleases" $asset.name
              if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
                Write-Host "Downloading reusable controller asset $($asset.name)."
                Invoke-WebRequest `
                  -Uri $asset.browser_download_url `
                  -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
                  -OutFile $destination
              }
            }
          }

          "needs_pack=$($needsPack.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Velopack installer and update packages
        shell: pwsh
        run: |
          vpk pack `
            --packId MulletHop.WaiverKiosk `
            --packVersion ${{ steps.version.outputs.value }} `
            --packDir publish `
            --mainExe MulletHopWaiverKiosk.exe `
            --packTitle "Mullet Hop Waiver Kiosk" `
            --packAuthors "Mullet Hop" `
            --icon assets/MulletHopFish.ico `
            --runtime win-x64 `
            --channel win `
            --outputDir Releases

      - name: Download prior POS controller release information
        id: pos_feed
        shell: pwsh
        run: |
          $needsPack = $true
          try {
            vpk download github `
              --repoUrl https://github.com/${{ github.repository }} `
              --token "${{ secrets.GITHUB_TOKEN }}" `
              --channel pos `
              --outputDir PosReleases
          }
          catch {
            Write-Host "No earlier POS Controller update feed exists. Building the first full installer."
            New-Item -ItemType Directory -Path PosReleases -Force | Out-Null
          }

          $currentVersion = "${{ steps.pos_version.outputs.value }}"
          $expectedPackage = "MulletHop.POSController-$currentVersion-pos-full.nupkg"
          $latestRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
            -SkipHttpErrorCheck
          $matchingAsset = @(
            $latestRelease.assets | Where-Object { $_.name -eq $expectedPackage }
          )

          if ($matchingAsset.Count -gt 0) {
            $needsPack = $false
            Write-Host "POS Controller $currentVersion is already packaged; reusing its release files."

            $posAssets = @(
              $latestRelease.assets | Where-Object {
                $_.name -eq "assets.pos.json" -or
                $_.name -eq "releases.pos.json" -or
                $_.name -like "MulletHop.POSController-*"
              }
            )
            New-Item -ItemType Directory -Path PosReleases -Force | Out-Null
            foreach ($asset in $posAssets) {
              $destination = Join-Path "PosReleases" $asset.name
              if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
                Invoke-WebRequest `
                  -Uri $asset.browser_download_url `
                  -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
                  -OutFile $destination
              }
            }
          }

          "needs_pack=$($needsPack.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build controller Velopack installer and update packages
        if: steps.controller_feed.outputs.needs_pack == 'true'
        shell: pwsh
        run: |
          vpk pack `
            --packId MulletHop.KioskController `
            --packVersion ${{ steps.controller_version.outputs.value }} `
            --packDir controller-publish `
            --mainExe MulletHopKioskController.exe `
            --packTitle "Mullet Hop Kiosk Controller" `
            --packAuthors "Mullet Hop" `
            --icon assets/MulletHopFish.ico `
            --runtime win-x64 `
            --channel controller `
            --outputDir ControllerReleases

      - name: Build POS controller Velopack installer and update packages
        if: steps.pos_feed.outputs.needs_pack == 'true'
        shell: pwsh
        run: |
          vpk pack `
            --packId MulletHop.POSController `
            --packVersion ${{ steps.pos_version.outputs.value }} `
            --packDir pos-publish `
            --mainExe MulletHopPosController.exe `
            --packTitle "Mullet Hop POS Controller" `
            --packAuthors "Mullet Hop" `
            --icon assets/MulletHopFish.ico `
            --runtime win-x64 `
            --channel pos `
            --outputDir PosReleases

      - name: Package kiosk controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ControllerPackage -Force | Out-Null
          $controllerSetup = Get-ChildItem `
            -LiteralPath ControllerReleases `
            -Filter '*-Setup.exe' | Select-Object -First 1
          if ($null -eq $controllerSetup) {
            throw 'The controller Setup executable was not generated.'
          }
          Copy-Item `
            -LiteralPath $controllerSetup.FullName `
            -Destination ControllerPackage/MulletHop.KioskController-Setup.exe
          Copy-Item controller/install/Install-Kiosk-Controller.cmd ControllerPackage/
          Copy-Item controller/install/Install-Kiosk-Controller.ps1 ControllerPackage/
          Copy-Item controller/install/Uninstall-Kiosk-Controller.ps1 ControllerPackage/
          Copy-Item controller/README.md ControllerPackage/
          Copy-Item cloudflare ControllerPackage/Cloudflare-Setup -Recurse
          Compress-Archive `
            -Path ControllerPackage/* `
            -DestinationPath "Mullet-Hop-Kiosk-Controller-${{ steps.controller_version.outputs.value }}.zip" `
            -Force

      - name: Package POS controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path PosPackage -Force | Out-Null
          $posSetup = Get-ChildItem `
            -LiteralPath PosReleases `
            -Filter '*-Setup.exe' | Select-Object -First 1
          if ($null -eq $posSetup) {
            throw 'The POS Controller Setup executable was not generated.'
          }
          Copy-Item `
            -LiteralPath $posSetup.FullName `
            -Destination PosPackage/MulletHop.POSController-Setup.exe
          Copy-Item pos-controller/install/Install-POS-Controller.cmd PosPackage/
          Copy-Item pos-controller/install/Install-POS-Controller.ps1 PosPackage/
          Copy-Item pos-controller/install/Uninstall-POS-Controller.ps1 PosPackage/
          Copy-Item pos-controller/README.md PosPackage/
          Compress-Archive `
            -Path PosPackage/* `
            -DestinationPath "Mullet-Hop-POS-Controller-${{ steps.pos_version.outputs.value }}.zip" `
            -Force

      - name: Publish GitHub release
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --publish `
            --releaseName "Mullet Hop Waiver Kiosk ${{ steps.version.outputs.value }}" `
            --tag "v${{ steps.version.outputs.value }}" `
            --channel win `
            --outputDir Releases

      - name: Attach controller installers and update feeds to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload `
            "v${{ steps.version.outputs.value }}" `
            "Mullet-Hop-Kiosk-Controller-${{ steps.controller_version.outputs.value }}.zip" `
            "Mullet-Hop-POS-Controller-${{ steps.pos_version.outputs.value }}.zip" `
            'ControllerReleases/*' `
            'PosReleases/*' `
            --repo "${{ github.repository }}" `
            --clobber

      - name: Keep installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mullet-Hop-Waiver-Kiosk-${{ steps.version.outputs.value }}
          path: |
            Releases/*-Setup.exe
            Releases/releases.*.json
            ControllerReleases/*-Setup.exe
            ControllerReleases/releases.*.json
            PosReleases/*-Setup.exe
            PosReleases/releases.*.json
            Mullet-Hop-Kiosk-Controller-${{ steps.controller_version.outputs.value }}.zip
            Mullet-Hop-POS-Controller-${{ steps.pos_version.outputs.value }}.zip
          if-no-files-found: error
