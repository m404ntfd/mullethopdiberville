name: Publish Kiosk Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiosk-release
  cancel-in-progress: false

jobs:
  publish-windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $projectText = Get-Content -LiteralPath "src/MulletHopWaiverKiosk.csproj" -Raw
          if ($projectText -notmatch '<Version>([^<]+)</Version>') {
            throw 'The project file does not contain a Version value.'
          }
          "value=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read controller version
        id: controller_version
        shell: pwsh
        run: |
          $projectText = Get-Content -LiteralPath "controller/src/MulletHopKioskController.csproj" -Raw
          if ($projectText -notmatch '<Version>([^<]+)</Version>') {
            throw 'The controller project file does not contain a Version value.'
          }
          "value=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Assemble screensaver video
        shell: pwsh
        run: ./scripts/Assemble-Screensaver.ps1

      - name: Restore packages
        shell: pwsh
        run: |
          dotnet restore src/MulletHopWaiverKiosk.csproj
          dotnet restore controller/src/MulletHopKioskController.csproj

      - name: Publish kiosk application
        shell: pwsh
        run: |
          dotnet publish src/MulletHopWaiverKiosk.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:UpdateRepositoryUrl=https://github.com/${{ github.repository }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            --output publish

      - name: Verify packaged screensaver video
        shell: pwsh
        run: |
          $screensaverPath = "publish/MulletHopScreensaver.mp4"
          if (-not (Test-Path -LiteralPath $screensaverPath -PathType Leaf)) {
            throw "The published kiosk is missing $screensaverPath."
          }

          $screensaver = Get-Item -LiteralPath $screensaverPath
          if ($screensaver.Length -lt 1MB) {
            throw "The published screensaver video is unexpectedly small."
          }

          Write-Host "Screensaver video included: $($screensaver.Length) bytes."

      - name: Publish kiosk controller
        shell: pwsh
        run: |
          dotnet publish controller/src/MulletHopKioskController.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.controller_version.outputs.value }} `
            -p:UpdateRepositoryUrl=https://github.com/${{ github.repository }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            --output controller-publish

      - name: Install matching Velopack command-line tool
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download prior kiosk release information
        shell: pwsh
        run: |
          $latestRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
            -SkipHttpErrorCheck

          if ($latestRelease.status -eq 404 -or -not $latestRelease.tag_name) {
            Write-Host "No earlier release exists. Building the first full installer."
          }
          else {
            vpk download github `
              --repoUrl https://github.com/${{ github.repository }} `
              --token "${{ secrets.GITHUB_TOKEN }}" `
              --channel win `
              --outputDir Releases
          }

      - name: Download prior controller release information
        shell: pwsh
        run: |
          try {
            vpk download github `
              --repoUrl https://github.com/${{ github.repository }} `
              --token "${{ secrets.GITHUB_TOKEN }}" `
              --channel controller `
              --outputDir ControllerReleases
          }
          catch {
            Write-Host "No earlier controller update feed exists. Building the first full controller installer."
            New-Item -ItemType Directory -Path ControllerReleases -Force | Out-Null
          }

      - name: Build Velopack installer and update packages
        shell: pwsh
        run: |
          vpk pack `
            --packId MulletHop.WaiverKiosk `
            --packVersion ${{ steps.version.outputs.value }} `
            --packDir publish `
            --mainExe MulletHopWaiverKiosk.exe `
            --packTitle "Mullet Hop Waiver Kiosk" `
            --packAuthors "Mullet Hop" `
            --icon assets/MulletHopFish.ico `
            --runtime win-x64 `
            --channel win `
            --outputDir Releases

      - name: Build controller Velopack installer and update packages
        shell: pwsh
        run: |
          vpk pack `
            --packId MulletHop.KioskController `
            --packVersion ${{ steps.controller_version.outputs.value }} `
            --packDir controller-publish `
            --mainExe MulletHopKioskController.exe `
            --packTitle "Mullet Hop Kiosk Controller" `
            --packAuthors "Mullet Hop" `
            --icon assets/MulletHopFish.ico `
            --runtime win-x64 `
            --channel controller `
            --outputDir ControllerReleases

      - name: Package kiosk controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ControllerPackage -Force | Out-Null
          $controllerSetup = Get-ChildItem `
            -LiteralPath ControllerReleases `
            -Filter '*-Setup.exe' | Select-Object -First 1
          if ($null -eq $controllerSetup) {
            throw 'The controller Setup executable was not generated.'
          }
          Copy-Item `
            -LiteralPath $controllerSetup.FullName `
            -Destination ControllerPackage/MulletHop.KioskController-Setup.exe
          Copy-Item controller/install/Install-Kiosk-Controller.cmd ControllerPackage/
          Copy-Item controller/install/Install-Kiosk-Controller.ps1 ControllerPackage/
          Copy-Item controller/install/Uninstall-Kiosk-Controller.ps1 ControllerPackage/
          Copy-Item controller/README.md ControllerPackage/
          Compress-Archive `
            -Path ControllerPackage/* `
            -DestinationPath "Mullet-Hop-Kiosk-Controller-${{ steps.controller_version.outputs.value }}.zip" `
            -Force

      - name: Publish GitHub release
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --publish `
            --releaseName "Mullet Hop Waiver Kiosk ${{ steps.version.outputs.value }}" `
            --tag "v${{ steps.version.outputs.value }}" `
            --channel win `
            --outputDir Releases

      - name: Attach controller installer and update feed to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload `
            "v${{ steps.version.outputs.value }}" `
            "Mullet-Hop-Kiosk-Controller-${{ steps.controller_version.outputs.value }}.zip" `
            'ControllerReleases/*' `
            --repo "${{ github.repository }}" `
            --clobber

      - name: Keep installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mullet-Hop-Waiver-Kiosk-${{ steps.version.outputs.value }}
          path: |
            Releases/*-Setup.exe
            Releases/releases.*.json
            ControllerReleases/*-Setup.exe
            ControllerReleases/releases.*.json
            Mullet-Hop-Kiosk-Controller-${{ steps.controller_version.outputs.value }}.zip
          if-no-files-found: error
