name: Apply Centered Raster Patch

on:
  push:
    branches:
      - fix/wristband-centered-raster-1.7.21
    paths:
      - scripts/Patch-CenteredWristbandRaster.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/wristband-centered-raster-1.7.21
          fetch-depth: 0

      - name: Patch source
        run: python scripts/Patch-CenteredWristbandRaster.py

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/Patch-CenteredWristbandRaster.py
          git rm .github/workflows/patch-wristband-centered-raster.yml
          git add pos-controller/src/DirectWristbandPrinter.cs pos-controller/src/MulletHopPosController.csproj
          git commit -m "Center full-head wristband raster from field diagnostic"
          git push origin HEAD:fix/wristband-centered-raster-1.7.21
